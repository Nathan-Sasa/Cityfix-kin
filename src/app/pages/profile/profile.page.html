<!-- <app-header [name]="profile"></app-header> -->

<ion-content 
	[fullscreen]="true"
	class="bg-clr-box!">

	<div
		class="flex justify-start items-center px-2 div-profile items-end border-b border-clr-accent/10 py-2">
		<div>
			<ion-buttons>
				<ion-button
					id="profile-modal"
					class="rounded-full">
					<ion-img
						slot="start"
						[src]="profile.avatar || 'assets/images/site/profileDefault/cityfix_profile.webp'"
						class="w-24 h-24 rounded-full object-cover overflow-hidden border-4 border-clr-accent/60"
					></ion-img>
					<ion-icon name="pencil-sharp" class="image-edit"></ion-icon>
				</ion-button>
				<ion-badge class="profile-badge">{{profile.status}}</ion-badge>
			</ion-buttons>
			<!-- <ion-button
				id="profile-modal"
				class="rounded-full"
				fill="clear">
				<ion-avatar>
					<ion-img
						slot="start"
						[src]="profile.avatar || 'assets/images/site/profileDefault/cityfix_profile.webp'"
						class="w-24 h-24 rounded-full object-cover overflow-hidden border-4 border-clr-accent/60"
					></ion-img>
				</ion-avatar>
				<ion-icon name="pencil-sharp" class="image-edit"></ion-icon>
				<ion-badge class="profile-badge">{{profile.status}}</ion-badge>
			</ion-button> -->
		</div>
		<div
			class="my-auto px-2">
			<div
				class=" flex items-center gap-1">
				<span
					class="text-2xl lg:text-3xl font-semibold">
					{{profile.username}}
				</span>
				<ion-icon 
					name="checkmark-circle-outline" 
					size="small"
					class="text-clr-accent"
				></ion-icon>
				<ion-button
					routerLink='/cityfix-kin/profile/settings'
					slot="end"
					fill="clear"
					class="absolute settings-button">
					<ion-icon name="settings"></ion-icon>
				</ion-button>
			</div>
			<p class="text-clr-span text-xs">{{profile.email}}</p>
			<div
				class="flex items-center justify-start gap-4 py-2 pr-2 *:not-last:border-r *:border-clr-accent/30 *:not-last:pr-2 *:text-xs lg:*:text-sm *:text-center"
				>
				<!-- données api recquise -->
				<span>
					2 Signal(s)
				</span>
				<span>
					120 Relation(s)
				</span>
				<span>
					342 Track(s)
				</span>
			</div>
		</div>
	</div>
	<!-- <div 
		class="signals-span px-2 pt-4 mb-4 flex items-center justify-start sticky -top-2 z-100000 relative"
		[ngClass]="getStatusClass(isDark)">
		<span class="font-semibold font-mono" >Signals</span>
	</div> -->
	<!-- =============================================================== -->
	<!-- ======================== feed profile ============================== -->
	<ion-toolbar class="sticky -top-2 pb-2">Signals</ion-toolbar>
	<div
		class="relative lg:w-1/2">
		<ion-list
			class="list-border-none"
			[inset]="false">
			<ion-item
				*ngFor="let p of profilePost"
				>
				<div
					class=" flex jusity-between gap-x-2 relative">
					<div
						class="w-6/10 h-44 flex flex-col justify-between relative">
						<h5>{{p.Desc}}</h5>
						<p class="line-clamp-3 text-clr-span">{{p.com}}</p>
						<span class="text-clr-spa mt-2 text-clr-accent">21-12-2025</span>
						<ion-button
							fill="clear"
							class="post-btn"
							[routerLink]="['/cityfix-kin/profile/map', p.LocId]">
							<ion-icon name="link"></ion-icon>
						</ion-button>
					</div>
					<div
						class="w-4/10 h-44 rounded-xl flex items-center justify-center relative overflow-hidden">
						<ion-img 
							[src]="p.Img"
							class="h-full w-full post-img objectif-cover"
						></ion-img>
						<!-- <img 
							[src]="p.Img" 
							alt=""
							class="w-full h-full objectif"	
						> -->
					</div>
				</div>
	
			</ion-item>
		</ion-list>
	</div>
	<!-- ======================= fin feed profile ======================== -->
	<!-- ========================================================= -->

	<!-- ========================================================== -->
	<!-- ====================== tous les modals =========================-->

	<ion-modal
		trigger="profile-modal"
		[initialBreakpoint]="1" 
		[breakpoints]="[0, 1]"
		class="profile-modal"
		>
		<ng-template>
			<div>
				<h2 class="px-2" expand="block">Photo profile</h2>
			</div>
			<div>
				<ion-list>
					<!-- ======= modal enfant affichier la photo profile ========= -->
					<ion-item
						[button]="true"
						class="custom-item cursor-pointer"
						id="profile-image-modal">
						<ion-icon name="eye" class="custom-icon"></ion-icon>
						<ion-label>Voir la photo de profile</ion-label>
					</ion-item>
					<ion-modal
						trigger="profile-image-modal">
						<ng-template>
							<ion-toolbar
								class="profile-image-modal-toolbar">
								<ion-button
									(click)="closeModal()"
									slot="end"
									fill="clear"
									>
									<ion-icon name="close"></ion-icon>
								</ion-button>
								<div
									class="flex pl-4 justify-center">
									<ion-title
										class="modal-title-center"
										>
										<!-- (click)="timerEvent()" -->
										Photo de profile
									</ion-title>
								</div>
							</ion-toolbar>
							<ion-content
								class="ion-page">
								<div
									class="h-full w-full flex items-center justify-center">
									<ion-img 
										[src]="profile.avatar || 'assets/images/site/profileDefault/cityfix_profile.webp'"
										class="modal-photo-profile"
									></ion-img>
								</div>
							</ion-content>
						</ng-template>
					</ion-modal>
					
					<!-- ==== modal enfant modifier la photo profile === -->
					<input
						type="file"
						accept="image/*"
						hidden
						#fileInput
						(change)="onFileSelected($event)"
					>
					
					<ion-item
						[button]="true"
						(click)="openFilePicker(fileInput)"
						class="custom-item cursor-pointer"
						>
						<!-- (click)="fileInput.click()" -->
						<ion-icon name="image-outline" class="custom-icon mr-2"></ion-icon>
						<ion-label>Changer l'image' de profile</ion-label>
					</ion-item>

					<!-- ==== modal enfant modifier la photo profile === -->
					<ion-item
						class="custom-item cursor-pointer"
						(click)="deleteAvatar()"
						[button]="true">
						<ion-icon name="image-outline" class="custom-icon mr-2"></ion-icon>
						<ion-label>Supprimer l'image de profile</ion-label>
					</ion-item>

					<ion-item
						class="custom-item cursor-pointer"
						[button]="true"
						routerLink='/cityfix-kin/profile/settings'
						(click)="closeModal()">
						<ion-icon name="person-circle" class="custom-icon"></ion-icon>
						<ion-label>Details profile</ion-label>
					</ion-item>

					<!-- <ion-item
						class="custom-item cursor-pointer">
						<ion-icon name="image-sharp" class="custom-icon"></ion-icon>
						<ion-label>Changer l'arrière plan</ion-label>
					</ion-item> -->

				</ion-list>
			</div>
		</ng-template>
	</ion-modal>
</ion-content>
